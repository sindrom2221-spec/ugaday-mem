name: Build DDNet PixelWalk + W Hammer + Speed Menu (Windows x64)

on:
  push:
    branches:
      - ddnet-dummy-hammer-speed-menu-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone DDNet and bundled libraries
        shell: pwsh
        run: git clone --depth 1 --recurse-submodules https://github.com/ddnet/ddnet.git ddnet

      - name: Apply and verify custom DDNet features
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python apply_custom_features.py ddnet
          if ($LASTEXITCODE -ne 0) { throw 'Custom feature installer failed' }
          Push-Location ddnet
          python scripts/check_config_variables.py
          if ($LASTEXITCODE -ne 0) { throw 'Config variable validation failed' }
          Pop-Location

      - name: Configure Windows x64 Release
        shell: pwsh
        run: >
          cmake -S ddnet -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DPREFER_BUNDLED_LIBS=ON
          -DVULKAN=OFF
          -DVIDEORECORDER=OFF
          -DWEBSOCKETS=OFF
          -DUPNP=OFF
          -DANTIBOT=OFF
          -DSTEAM=OFF
          -DDOWNLOAD_GTEST=OFF

      - name: Build DDNet
        shell: pwsh
        run: cmake --build build --config Release --target everything --parallel 4

      - name: Package Windows client
        shell: pwsh
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Verify packaged executable contains custom features
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile
          archives = list(Path("build").glob("*.zip"))
          if not archives:
              raise SystemExit("No packaged ZIP found in build/")
          candidates = []
          for archive in archives:
              with ZipFile(archive) as z:
                  exe_names = [n for n in z.namelist() if n.replace("\\", "/").lower().endswith("ddnet.exe")]
                  for name in exe_names:
                      candidates.append((archive, z.read(name)))
          if not candidates:
              raise SystemExit("Packaged DDNet.exe not found inside build ZIPs")
          required = [b"cl_pixelwalk", b"cl_pixelwalk_speed", b"+pixelwalk", b"Enable PixelWalk", b"Dummy Hammer Speed", b"cl_dummy_hammer_w_speed", b"cl_avoid_freeze", b"cl_avoid_freeze_range", b"Enable Avoid Freeze", b"Stop Distance", b"+avoidfreeze_override", b"Dummy Hammer (W)", b"Freeze Override", b"cl_hook_aim", b"cl_hook_aim_fov", b"cl_hook_aim_show_fov", b"Enable Hook Aim", b"Hook Aim FOV", b"Show FOV", b"Hook Aim", b"S1ndrom", b"Aim hook toward the closest player in FOV only while the hook key is held", b"Only guides your hook while you hold the hook key."]
          for archive, binary in candidates:
              missing = [token.decode("ascii") for token in required if token not in binary]
              if missing:
                  raise SystemExit(f"{archive}: missing custom executable strings: {missing}")
              print(f"Verified custom features in {archive}")
          '@ | python -

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DDNet-S1ndrom-HoldToHookAim-Windows-x64
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14
