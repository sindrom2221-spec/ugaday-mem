<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114"><title>УГАДАЙ МЕМ</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
<header class="topbar">
<a class="brand" href="#"><span class="brand-mark">У</span> УГАДАЙ МЕМ</a>
<nav id="nav" class="nav"></nav><div id="user-chip"></div>
</header>

<main id="app"><div class="loading">Загрузка…</div></main>

<footer>УГАДАЙ МЕМ <span>Играйте с друзьями. Угадывайте мемы.</span></footer>
</div>
<!-- Шуточная рекламная плашка с локальным скримером -->
<button id="pornhub-ad" class="pornhub-ad" type="button" aria-label="Открыть рекламу PORNHUB">
  <span class="pornhub-logo">PORN<span>HUB</span></span>
  <span class="pornhub-caption">нажми… если не боишься</span>
  <span class="pornhub-tag">РЕКЛАМА</span>
</button>
<div id="jumpscare" class="jumpscare" aria-hidden="true" role="dialog" aria-label="Скример">
  <div class="jumpscare-noise"></div>
  <div class="scare-face" aria-hidden="true"><div class="scare-eyes"><i></i><i></i></div><div class="scare-nose"></div><div class="scare-mouth"><b></b><b></b><b></b><b></b><b></b></div></div>
  <div class="scare-word">БУУУ!!!</div>
  <button id="close-jumpscare" class="scare-close" type="button">Закрыть</button>
</div>

<!-- Отдельное всплывающее рекламное окно Depni Hatu -->
<button id="partner-ad-open" class="partner-ad-fab" type="button" aria-label="Открыть рекламу Depni Hatu">
  <span class="partner-ad-fab-label">РЕКЛАМА</span>
  <strong>DEPNI HATU</strong>
  <span aria-hidden="true">↗</span>
</button>
<div id="partner-ad-modal" class="partner-ad-modal" aria-hidden="true">
  <section class="partner-ad-dialog" role="dialog" aria-modal="true" aria-labelledby="partner-ad-title">
    <header class="partner-ad-dialog-head">
      <div>
        <span class="partner-ad-eyebrow">ПАРТНЁРСКИЙ ПРОЕКТ · РЕКЛАМА</span>
        <h2 id="partner-ad-title">DEPNI HATU</h2>
      </div>
      <button id="partner-ad-close" class="partner-ad-close" type="button" aria-label="Закрыть рекламу">×</button>
    </header>
    <div class="partner-ad-dialog-body">
      <div class="partner-ad-creative">
        <div class="partner-ad-orbit partner-ad-orbit-one"></div>
        <div class="partner-ad-orbit partner-ad-orbit-two"></div>
        <div class="partner-ad-creative-top"><span>ОТКРОЙ ДЛЯ СЕБЯ</span><span class="partner-ad-live-dot">● ПАРТНЁР</span></div>
        <div class="partner-ad-wordmark">DEPNI<span>HATU</span></div>
        <p class="partner-ad-tagline">Новый сайт ждёт тебя.</p>
        <div class="partner-ad-creative-bottom">
          <span>depni-hatu.onrender.com</span>
          <span class="partner-ad-arrow" aria-hidden="true">↗</span>
        </div>
      </div>
      <p class="partner-ad-note">Нажми кнопку ниже, чтобы открыть Depni Hatu в новой вкладке.</p>
    </div>
    <footer class="partner-ad-dialog-foot">
      <span>DEPNI HATU</span>
      <div class="partner-ad-dialog-actions">
        <button id="partner-ad-dismiss" class="partner-ad-dismiss" type="button">Закрыть</button>
        <a class="partner-ad-link" href="https://depni-hatu.onrender.com/" target="_blank" rel="noopener noreferrer">Перейти на сайт ↗</a>
      </div>
    </footer>
  </section>
</div>
<script>
(() => {
  const modal = document.getElementById("partner-ad-modal");
  const openButton = document.getElementById("partner-ad-open");
  const closeButton = document.getElementById("partner-ad-close");
  const dismissButton = document.getElementById("partner-ad-dismiss");
  if (!modal || !openButton) return;

  const openAd = () => {
    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("partner-ad-modal-open");
    try { sessionStorage.setItem("depni-hatu-ad-seen", "1"); } catch (_) {}
  };
  const closeAd = () => {
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("partner-ad-modal-open");
  };

  openButton.addEventListener("click", openAd);
  closeButton?.addEventListener("click", closeAd);
  dismissButton?.addEventListener("click", closeAd);
  modal.addEventListener("click", event => {
    if (event.target === modal) closeAd();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && modal.classList.contains("is-open")) closeAd();
  });

  let alreadySeen = false;
  try { alreadySeen = sessionStorage.getItem("depni-hatu-ad-seen") === "1"; } catch (_) {}
  if (!alreadySeen) window.setTimeout(openAd, 1300);
})();
</script>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
