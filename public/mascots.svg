<style>
  .theme{--ink:#211b19;--cat-fur:url(#catFur);--dog-fur:url(#dogFur);--frog-skin:url(#frogSkin);--white-skin:url(#whiteSkin);--clothes:#292b36;--accent:#9a88d9;}
  .theme-dark{--ink:#171824;--clothes:#252632;--accent:#8e7cd0;}
  .theme-comic{--ink:#17120b;--clothes:#ed4b35;--accent:#ffd52e;--cat-fur:#ffad3e;--dog-fur:#f3bd61;--frog-skin:#70b842;--white-skin:#fff8eb;}
  .theme-light{--ink:#26384e;--clothes:#dcecff;--accent:#4386d6;--cat-fur:#e9a45e;--dog-fur:#edc28c;--frog-skin:#92c96b;--white-skin:#fff;}
  .theme-neon{--ink:#1a1534;--clothes:#171b39;--accent:#35f4ed;--cat-fur:#fa9b5e;--dog-fur:#e4b16f;--frog-skin:#8bd35a;}
  .theme-vaporwave{--ink:#3b2758;--clothes:#47346d;--accent:#48dce9;--cat-fur:#ffb9a7;--dog-fur:#f3c6b5;--frog-skin:#a0d6b2;}
  .theme-8bit{--ink:#131e29;--clothes:#24536a;--accent:#a8ff60;--cat-fur:#f4a04a;--dog-fur:#d6a45c;--frog-skin:#77d75c;--white-skin:#f5f3e9;}
  .theme-horror{--ink:#100b10;--clothes:#21131d;--accent:#c62e48;--cat-fur:#b18b70;--dog-fur:#b49b82;--frog-skin:#718b5b;--white-skin:#d7d0d0;}
  .theme-y2k{--ink:#495d82;--clothes:#9caecb;--accent:#ff83c8;--cat-fur:#f5b37d;--dog-fur:#eecb9c;--frog-skin:#96d7a9;}
  .theme-hacker{--ink:#0b2916;--clothes:#102d1a;--accent:#39ff70;--cat-fur:#b27c45;--dog-fur:#a98551;--frog-skin:#5fbd61;--white-skin:#dfeadc;}
  .theme-pastel{--ink:#76617e;--clothes:#c8b6de;--accent:#eea8c7;--cat-fur:#f6bd8b;--dog-fur:#f0d0a3;--frog-skin:#9ccf9f;--white-skin:#fffafb;}
  .theme-comic use{stroke-width:1.15;paint-order:stroke fill;filter:drop-shadow(4px 4px 0 #17120b);}
  .theme-comic .decoration{stroke:#21170e;stroke-width:3;}
  .theme-neon use{filter:url(#neonGlow);}
  .theme-horror use{filter:url(#redGlow);}
  .theme-y2k use{filter:url(#softShadow);}
  .theme-pastel use{filter:url(#softShadow);}
  .theme-8bit{shape-rendering:crispEdges;}
</style>
